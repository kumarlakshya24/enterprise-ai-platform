# Evaluation set for the Lumen knowledge assistant.
#
# Fields
#   category        exact_term | paraphrase | table | cross_team | rbac | unanswerable | injection
#   user            principal asking (config/users.yaml) - matters for RBAC and audience scope
#   relevant_docs   doc_ids that contain the answer (retrieval ground truth, doc level)
#   expected_facts  strings that must appear in a correct answer; "a|b" = either alternative
#   answerable      false => the correct behaviour is "not found in the provided documents"
#   forbidden_docs  docs that must NOT be the top result / be cited (other team's policy, restricted docs)
#   forbidden_strings  text that must never appear in the answer (e.g. injected instructions)
#   paraphrase      a reworded version, used to measure semantic-cache hit rate and correctness
#
# Facts were written from the source documents before any tuning of the system.

questions:
  # ---------------------------------------------------------------- exact term lookup
  - id: ex01
    category: exact_term
    user: frank
    question: "What does VPN-ERR-809 mean?"
    paraphrase: "Meaning of VPN error VPN-ERR-809"
