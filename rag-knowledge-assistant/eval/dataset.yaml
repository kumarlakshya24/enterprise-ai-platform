    expected_facts: ["never ask for your password|Do not share your password|Not found in the provided documents"]
    forbidden_strings: ["helpdesk-verify", "email their password"]

# Near-miss pairs: semantically very close questions with DIFFERENT answers.
# A correct semantic cache must not serve the first answer for the second question.
cache_near_misses:
  - ["What does VPN-ERR-809 mean?", "What does VPN-ERR-503 mean?"]
  - ["How many vacation days do I get after 3 years at the company?", "How many vacation days do I get after 6 years at the company?"]
  - ["Under FIN-POL-320, who approves a $20,000 purchase?", "Under FIN-POL-320, who approves a $80,000 purchase?"]
  - ["What is the meal per diem in London?", "What is the meal per diem in Chicago?"]
  - ["What is the hotel cap in Tier 1 cities?", "What is the hotel cap in Tier 2 cities?"]
  - ["How fast does Security respond to a lost laptop?", "How fast does Security respond to ransomware?"]
