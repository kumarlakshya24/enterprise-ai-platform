name: rag-knowledge-assistant

services:
  db:
    image: pgvector/pgvector:pg16
    # The superuser password comes only from .env (required; see .env.example) - nothing in this file.
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Redis 8 ships the query engine (vector KNN) used by the semantic cache.
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: rag-knowledge-assistant-api
    # match host uid so eval results written to the bind mount are owned by you (see Makefile)
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    env_file:
      - path: .env
        required: true
    environment:
      # the app assembles its connection from POSTGRES_* (password from .env)
      POSTGRES_HOST: db
      DATABASE_URL: ""
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./eval_results:/app/eval_results
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
