[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-sandbox"
version = "0.1.0"
description = "Offline sandbox for untrusted agent tool calls: policy, path and import guards, resource limits, and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
forge = ["**/*.yaml", "**/*.html", "**/*.js", "**/*.css"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["reports", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",
    "S102",
    "S603",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"eval/**" = ["S105", "S108", "T201"]
"bench/**" = ["T201"]
"scripts/**" = ["T201"]
"forge/sandbox/child.py" = ["S102"]
"forge/cli.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
