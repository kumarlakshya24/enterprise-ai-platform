[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.1.0"
description = "Offline embedding CDC: versioned indexes, blue/green swap, dual-write model migration, and a proved right to be forgotten."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
conduit = "conduit.cli:main"

[tool.setuptools.packages.find]
include = ["conduit*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",
    "S311",
    "SIM905",
    "RUF001",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 140

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"conduit/evalrun.py" = ["E501"]
"conduit/synthetic.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["conduit"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
