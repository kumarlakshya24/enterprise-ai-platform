id: incident_response
title: SEV1 incident bridge
summary: Runbook lookup, then status page and page-out with no dependency between them, then a postmortem.
on_failure: compensate
budget:
  max_steps: 20
  max_cost_usd: 1.0
  on_exceeded: pause
activities:
  - id: runbook
    agent: research
    tool: lumen.ask
    order: 10
    cost_usd: 0.002
    latency_ms: 40
    timeout_ms: 2000
    max_attempts: 2
    backoff_ms: 20
    args:
      question: "What is the SEV1 incident policy?"
  - id: status_page
    agent: ops
    tool: status.publish
    order: 20
    deps: [runbook]
    side_effect: true
    cost_usd: 0.002
    latency_ms: 30
    timeout_ms: 2000
    max_attempts: 2
    backoff_ms: 20
  - id: page_oncall
    agent: ops
    tool: pager.page
    order: 30
    deps: [runbook]
    side_effect: true
    cost_usd: 0.002
    latency_ms: 25
    timeout_ms: 2000
    max_attempts: 2
    backoff_ms: 20
  - id: draft
    agent: research
    tool: postmortem.draft
    order: 40
    deps: [status_page, page_oncall]
    cost_usd: 0.003
    latency_ms: 50
    timeout_ms: 2000
    max_attempts: 1
    backoff_ms: 0
  - id: publish
    agent: comms
    tool: postmortem.publish
    order: 50
    deps: [draft]
    side_effect: true
    cost_usd: 0.002
    latency_ms: 30
    timeout_ms: 2000
    max_attempts: 2
    backoff_ms: 20
