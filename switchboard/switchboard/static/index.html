<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switchboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>Switchboard</strong>
      <span class="muted">offline model router</span>
    </div>
    <p class="banner">Mock models only. Catalog latency and price are estimates. Router overhead is measured on this process.</p>
    <div class="who muted small" id="health"></div>
  </header>
  <main>
    <section class="panel">
      <div id="scenarios" class="chips" role="list"></div>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="5" spellcheck="false"></textarea>
      <div class="controls">
        <label>Policy
          <select id="policy"></select>
        </label>
        <label>Budget override, USD
          <input id="budget" type="number" min="0.0001" max="10" step="0.001" placeholder="policy ceiling">
        </label>
        <label>SLO override, ms
          <input id="slo" type="number" min="1" max="120000" step="1" placeholder="policy SLO">
        </label>
        <button id="run" class="primary" type="button">Route</button>
        <button id="compare" type="button">Compare four policies</button>
        <button id="dry" type="button">Dry run</button>
        <button id="reset" class="ghost" type="button">Reset stats</button>
      </div>
      <p id="blurb" class="muted small"></p>
    </section>
    <section id="result" class="panel" aria-live="polite"></section>
    <section id="stats" class="panel"></section>
  </main>
</body>
</html>
