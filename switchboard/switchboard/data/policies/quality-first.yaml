version: "2026.11.05"
name: quality-first
description: >
  Highest capability among models that clear the floor, the budget, and the SLO.
  The budget is $0.50 so a normal prompt cannot price the flagship out.
  Hosted failures do not fall through to a weaker local model.
selection: highest_capability
weights: {capability: 0.70, cost: 0.20, latency: 0.10}
budget_usd: 0.50
latency_slo_ms: 3000
min_quality: 0.55
min_headroom: 0.00
fallback:
  order: [premium, balanced, fast-cheap]
  allow_local_on_total_failure: false
  max_attempts: 2
rules:
  - id: R-SENSITIVE-LOCAL
    description: Confidential or restricted content stays on the local model.
    when: {sensitivity_in: [confidential, restricted]}
    pin: local
    waive: [capability, budget, latency, quality]
    stop_fallback: true
  - id: R-REALTIME-HINT
    description: Real-time wording tightens the SLO to 120 ms.
    when: {latency_sensitivity: high}
    max_latency_ms: 120
