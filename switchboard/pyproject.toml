[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "0.1.0"
description = "Offline model router: classify a request, score a catalog of mock models, and fall back under a versioned policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["switchboard*"]

[tool.setuptools.package-data]
switchboard = ["data/**/*.yaml", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"eval/**" = ["E501", "T201"]
"bench/**" = ["E501", "T201"]
"scripts/**" = ["E501", "T201"]
"switchboard/evaluation.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
