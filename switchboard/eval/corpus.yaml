# Hand-labeled routing cases. Labels were assigned from the written rules
# (capability floor, headroom, SLO, pin, selection mode), then checked by
# `make eval`. They are not generated by the router at test time.
version: "2026.11.05"
cases:
  - {id: easy-default, category: easy_chat, policy: default, prompt: "What is a load balancer, in two sentences?", expected_model: balanced, expected_outcome: success}
  - {id: moderate-default, category: moderate, policy: default, prompt: "Explain cache invalidation for a production API. Cover stale reads, thundering herds, and the edge cases that show up when two regions write the same key. I want the tradeoffs a reviewer would ask about, including what you give up by caching at the edge versus caching in the service. Keep it concrete.", expected_model: balanced, expected_outcome: success}
  - {id: sum-short-default, category: summarize, policy: default, prompt: "Summarize: deploys happen on Tuesday. Rollbacks need two people.", expected_model: balanced, expected_outcome: success}
  - {id: sum-long-default, category: summarize, policy: default, prompt: "Summarize the production migration plan, including the edge cases around concurrent writers and the formal cutover checklist. The service keeps both readers up during the migration. The service keeps both readers up during the migration. The service keeps both readers up during the migration. The service keeps both readers up during the migration.", expected_model: balanced, expected_outcome: success}
  - {id: extract-default, category: extract, policy: default, prompt: "Extract the key-value pairs from this note: region=us-east, tier=standard, owner=platform.", expected_model: balanced, expected_outcome: success}
  - {id: code-med-default, category: code, policy: default, prompt: "Refactor this function for production.\n\n```python\ndef load(path):\n    return open(path).read()\n```\n", expected_model: premium, expected_outcome: success, note: "Balanced clears the floor by 0.08, under the 0.10 headroom, so default steps up to Premium."}
  - {id: code-hard-default, category: code, policy: default, prompt: "Refactor this service for a concurrent production migration. Optimize the hot path and cover the edge cases around partial failure.\n\n```python\ndef handle(events):\n    for event in events:\n        write(event)\n```\nThe migration has to keep the old reader working while the new writer is turned on, region by region.", expected_model: premium, expected_outcome: success}
  - {id: math-easy-default, category: math, policy: default, prompt: "Calculate 17 * 23 and show the multiplication.", expected_model: premium, expected_outcome: success, note: "Balanced math capability sits inside the headroom band."}
  - {id: math-hard-default, category: math, policy: default, prompt: "Prove the theorem formally and show the asymptotic bound step by step. Then prove the edge case where the bound is tight, and state the assumptions you needed for the formal argument.", expected_model: premium, expected_outcome: success}
  - {id: sensitive-default, category: sensitive, policy: default, prompt: "Confidential note: Ada's email is ada@example.com. Summarize the billing complaint for the on-call engineer and do not send it to a hosted tool.", expected_model: local, expected_outcome: success}
  - {id: ssn-default, category: sensitive, policy: default, prompt: "The restricted record lists SSN 987-65-4320. What should the agent do?", expected_model: local, expected_outcome: success}
  - {id: email-default, category: internal, policy: default, prompt: "Ping ada@example.com about the lunch menu.", expected_model: balanced, expected_outcome: success, note: "A single email is internal, not a pin to local."}
  - {id: realtime-default, category: latency, policy: default, prompt: "Reply asap, in one sentence: what is a load balancer?", expected_model: fast-cheap, expected_outcome: success}
  - {id: batch-default, category: summarize, policy: default, prompt: "Batch this overnight: summarize the changelog in one paragraph.", expected_model: balanced, expected_outcome: success}
  - {id: card-default, category: sensitive, policy: default, prompt: "The confidential ticket includes card 4111-1111-1111-1111. Draft a short reply.", expected_model: local, expected_outcome: success}
  - {id: budget-tight, category: budget, policy: default, prompt: "What is a load balancer, in two sentences?", budget_usd: 0.0001, expected_model: fast-cheap, expected_outcome: success, note: "Headroom relaxes once Balanced and Premium miss the tightened budget."}

  - {id: easy-cost, category: easy_chat, policy: cost-saver, prompt: "What is a load balancer, in two sentences?", expected_model: fast-cheap, expected_outcome: success}
  - {id: code-med-cost, category: code, policy: cost-saver, prompt: "Refactor this function for production.\n\n```python\ndef load(path):\n    return open(path).read()\n```\n", expected_model: balanced, expected_outcome: success}
  - {id: math-easy-cost, category: math, policy: cost-saver, prompt: "Calculate 17 * 23 and show the multiplication.", expected_model: balanced, expected_outcome: success}
  - {id: math-hard-cost, category: math, policy: cost-saver, prompt: "Prove the theorem formally and show the asymptotic bound step by step. Then prove the edge case where the bound is tight, and state the assumptions you needed for the formal argument.", expected_model: premium, expected_outcome: success}
  - {id: sensitive-cost, category: sensitive, policy: cost-saver, prompt: "Confidential note: Ada's email is ada@example.com. Summarize the billing complaint for the on-call engineer and do not send it to a hosted tool.", expected_model: local, expected_outcome: success}

  - {id: easy-latency, category: latency, policy: latency-first, prompt: "What is a load balancer, in two sentences?", expected_model: fast-cheap, expected_outcome: success}
  - {id: moderate-latency, category: latency, policy: latency-first, prompt: "Explain cache invalidation for a production API. Cover stale reads, thundering herds, and the edge cases that show up when two regions write the same key. I want the tradeoffs a reviewer would ask about, including what you give up by caching at the edge versus caching in the service. Keep it concrete.", expected_model: null, expected_outcome: rejected}
  - {id: extract-latency, category: latency, policy: latency-first, prompt: "Extract the key-value pairs from this note: region=us-east, tier=standard, owner=platform.", expected_model: null, expected_outcome: rejected}
  - {id: math-hard-latency, category: latency, policy: latency-first, prompt: "Prove the theorem formally and show the asymptotic bound step by step. Then prove the edge case where the bound is tight.", expected_model: null, expected_outcome: rejected}
  - {id: sensitive-latency, category: sensitive, policy: latency-first, prompt: "Confidential note: Ada's email is ada@example.com. Summarize the billing complaint.", expected_model: local, expected_outcome: success, note: "The pin waives the 100 ms SLO and records the waiver."}
  - {id: realtime-latency, category: latency, policy: latency-first, prompt: "Reply asap, in one sentence: what is a load balancer?", expected_model: fast-cheap, expected_outcome: success}

  - {id: easy-quality, category: easy_chat, policy: quality-first, prompt: "What is a load balancer, in two sentences?", expected_model: premium, expected_outcome: success}
  - {id: code-med-quality, category: code, policy: quality-first, prompt: "Refactor this function for production.\n\n```python\ndef load(path):\n    return open(path).read()\n```\n", expected_model: premium, expected_outcome: success}
  - {id: realtime-quality, category: latency, policy: quality-first, prompt: "Reply asap, in one sentence: what is a load balancer?", expected_model: fast-cheap, expected_outcome: success, note: "The real-time rule tightens the SLO to 120 ms, so the flagship is ineligible."}
  - {id: sensitive-quality, category: sensitive, policy: quality-first, prompt: "Confidential note: Ada's email is ada@example.com. Summarize the billing complaint.", expected_model: local, expected_outcome: success}

  - {id: fallback-timeout, category: fallback, policy: cost-saver, prompt: "What is a load balancer, in two sentences?", fault: {model: fast-cheap, mode: timeout}, expected_model: balanced, expected_outcome: fallback}
  - {id: fallback-escape, category: fallback, policy: default, prompt: "Prove the theorem formally and show the asymptotic bound step by step. Then prove the edge case where the bound is tight, and state the assumptions you needed for the formal argument.", fault: {model: premium, mode: timeout}, expected_model: local, expected_outcome: fallback, expected_degraded: true}
  - {id: fallback-no-escape, category: fallback, policy: quality-first, prompt: "Prove the theorem formally and show the asymptotic bound step by step. Then prove the edge case where the bound is tight, and state the assumptions you needed for the formal argument.", fault: {model: premium, mode: error}, expected_model: null, expected_outcome: failed}
  - {id: fallback-no-spill, category: fallback, policy: default, prompt: "Confidential note: Ada's email is ada@example.com. Summarize the billing complaint for the on-call engineer and do not send it to a hosted tool.", fault: {model: local, mode: error}, expected_model: null, expected_outcome: failed}
  - {id: fallback-quality, category: fallback, policy: cost-saver, prompt: "What is a load balancer, in two sentences?", fault: {model: fast-cheap, mode: low_quality}, expected_model: balanced, expected_outcome: fallback}
