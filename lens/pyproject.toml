[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lens"
version = "0.1.0"
description = "LLMOps observability and continuous evaluation: OpenTelemetry-style traces, sampled judging, drift, SLO burn rates, and a CI regression gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
lens = "lens.cli:main"

[tool.setuptools.packages.find]
include = ["lens*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reports", "dashboard/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",
    "S311",
    "SIM905",
    "RUF001",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 140

[tool.ruff.lint.per-file-ignores]
"lens/judge/llm.py" = ["S310"]
"tests/**" = ["S105", "S106"]
"lens/evalset/**" = ["E501"]
"lens/dashboard/render.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["lens"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
