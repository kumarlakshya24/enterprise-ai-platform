[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "charter"
version = "0.1.0"
description = "Offline AI governance control plane: Cedar-subset policies, model cards, residency checks, and an EU AI Act / NIST evidence pack."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "httpx>=0.27"]

[project.scripts]
charter = "charter.cli:main"

[tool.setuptools.packages.find]
include = ["charter*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S105", "SIM905", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/capture_demo.py" = ["S603", "S607"]
"charter/config.py" = ["S105"]
"charter/ingest/aegis.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
packages = ["charter"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
