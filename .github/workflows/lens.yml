name: lens

on:
  push:
    paths: ["lens/**", ".github/workflows/lens.yml"]
  pull_request:
    paths: ["lens/**", ".github/workflows/lens.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: lens

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lens/requirements-dev.txt
      - name: Install
        run: make install PY=python
      - name: Lint
        run: make lint PY=python
      - name: Type check
        run: make typecheck PY=python
      - name: Tests
        run: make test PY=python
      - name: Eval (clean gate must pass, seeded regression must be caught)
        run: make eval PY=python
      - name: Clean candidate is allowed
        run: make gate PY=python
      - name: Seeded regression is blocked
        run: |
          set +e
          make gate-seeded PY=python
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "the seeded candidate passed the gate; it must not"
            exit 1
          fi
          echo "seeded regression blocked (exit ${code})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lens-reports
          path: lens/reports/
