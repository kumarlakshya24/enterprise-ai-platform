name: rag-knowledge-assistant

on:
  push:
    paths: ["rag-knowledge-assistant/**", ".github/workflows/rag-knowledge-assistant.yml"]
  pull_request:
    paths: ["rag-knowledge-assistant/**", ".github/workflows/rag-knowledge-assistant.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: rag-knowledge-assistant

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Integration tests use the deterministic hash embedder, so no model download is needed.
    # The Postgres password below exists only inside this throwaway CI container.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_DB: rag
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://rag:ci-only-throwaway@localhost:5432/rag
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag-knowledge-assistant/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: make lint PY=python
      - name: Unit and integration tests (pgvector + Redis 8)
        run: python -m pytest -q
