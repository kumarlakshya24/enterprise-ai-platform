name: arena

on:
  push:
    paths: ["arena/**", ".github/workflows/arena.yml"]
  pull_request:
    paths: ["arena/**", ".github/workflows/arena.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: arena

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arena/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: make lint PY=python
      - name: Tests
        run: make test PY=python
      - name: Demo checks
        run: make demo PY=python
      - name: Gate (committed quality matches a fresh eval)
        run: make gate PY=python
      - name: Eval report
        run: make eval PY=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-reports
          path: arena/reports/
