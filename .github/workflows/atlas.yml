name: atlas

on:
  push:
    paths: ["atlas/**", ".github/workflows/atlas.yml"]
  pull_request:
    paths: ["atlas/**", ".github/workflows/atlas.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: atlas

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: atlas/requirements-dev.txt
      - name: Install
        run: make install PY=python
      - name: Lint
        run: make lint PY=python
      - name: Tests
        run: make test PY=python
      - name: Kill a worker mid-refund, resume, prove exactly one debit
        run: make kill-resume PY=python
