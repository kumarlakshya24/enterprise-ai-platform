name: conduit

on:
  push:
    paths: ["conduit/**", ".github/workflows/conduit.yml"]
  pull_request:
    paths: ["conduit/**", ".github/workflows/conduit.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: conduit

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conduit/requirements-dev.txt
      - name: Install
        run: make install PY=python
      - name: Lint
        run: make lint PY=python
      - name: Type check
        run: make typecheck PY=python
      - name: Tests
        run: make test PY=python
      - name: Eval
        run: make eval PY=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduit-reports
          path: conduit/reports/
