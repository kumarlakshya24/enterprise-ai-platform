[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arena"
version = "0.1.0"
description = "Offline bench that compares prompt, RAG, a LoRA-style adapter, and a distilled student on one labeled runbook."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.setuptools.package-data]
arena = ["data/**/*", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
