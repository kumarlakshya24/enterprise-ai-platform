[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-gateway"
version = "0.1.0"
description = "Secure AI agent gateway: DLP, tokenization, private classification, tool guardrails, and tamper-evident audit between employees, agents, and third-party LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "cryptography>=42",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "spacy>=3.7,<3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["**/*.json", "**/*.yaml", "**/*.txt", "**/*.html", "**/*.js", "**/*.css"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0603",
    "PLC0415",  # lazy imports are deliberate for heavy optional deps (spaCy, redis)
    "S101",     # assert is fine in tests
    "RUF001", "RUF002", "RUF003",  # we intentionally handle unicode lookalikes and bullets
    "B008",     # FastAPI Depends() in defaults is the idiom
]

[tool.ruff.lint.pycodestyle]
# Formatter wraps at 110; long string literals may run to 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PLC0415"]
"eval/**" = ["S105", "T201"]
"bench/**" = ["T201"]
"scripts/**" = ["T201", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
packages = ["aegis"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["spacy.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
